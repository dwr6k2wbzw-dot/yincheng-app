<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>做專屬邀請函｜重返大稻埕</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 店家用：輸入客人名字 → 拿到每個人專屬的邀請函連結（開場會寫「致 某某」） */
:root {
  --ink: #14110D; --paper: #1C1814; --cream: #ECE2CC; --dust: #A99B81; --brass: #C9A86A;
  --line: rgba(201, 168, 106, 0.32);
  --serif: 'Noto Serif TC', 'Songti TC', 'PMingLiU', serif;
  --sans: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ink); color: var(--cream); }
body { font-family: var(--sans); font-size: 16px; line-height: 1.7; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.wrap { max-width: 600px; margin: 0 auto; padding-block: 40px 64px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
.kicker { font-size: 13px; letter-spacing: 0.4em; color: var(--brass); }
h1 { margin: 0; font-family: var(--serif); font-weight: 900; font-size: 34px; letter-spacing: 0.08em; }
p { margin: 0; color: var(--dust); }
label { font-size: 14px; letter-spacing: 0.2em; color: var(--brass); }
textarea { width: 100%; min-height: 140px; padding: 14px; background: var(--paper); color: var(--cream); border: 1px solid var(--line); font: inherit; font-size: 18px; line-height: 1.6; resize: vertical; }
textarea:focus, button:focus-visible, a:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.list { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.item { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding-block: 14px; border-bottom: 1px solid var(--line); }
.item b { font-family: var(--serif); font-size: 20px; letter-spacing: 0.06em; flex: 1 1 8em; min-width: 0; overflow-wrap: anywhere; }
.item code { flex: 1 1 100%; order: 3; font-size: 12px; color: var(--dust); overflow-wrap: anywhere; user-select: all; }
.btn { min-height: 44px; padding: 0 16px; display: inline-flex; align-items: center; background: transparent; color: var(--brass); border: 1px solid var(--line); font: inherit; font-size: 14px; letter-spacing: 0.1em; text-decoration: none; cursor: pointer; }
.btn.main { background: var(--brass); color: var(--ink); border-color: var(--brass); font-weight: 700; }
.empty { padding-block: 16px; color: var(--dust); font-size: 14px; }
.tip { font-size: 13px; }
</style>
</head>
<body>
<main class="wrap">
  <div class="kicker">小城外十週年・店家用</div>
  <h1>做專屬邀請函</h1>
  <p>輸入客人的名字（一行一位），每個人會拿到自己的連結。打開時開場會寫「致　名字」，信的第一句也會換成他的名字。</p>
  <label for="names">客人名字</label>
  <textarea id="names" placeholder="例：&#10;阿明&#10;王小姐&#10;老陳"></textarea>
  <div class="list" id="list"><div class="empty">輸入名字後，下面會出現每個人的連結。</div></div>
  <p class="tip">名字最多 20 個字。沒有名字的連結會寫「致　老朋友」：<a href="./" style="color: var(--brass)">通用版</a></p>
</main>
<script>
(function () {
  var box = document.getElementById('names');
  var list = document.getElementById('list');
  var base = new URL('./', location.href).href;
  function linkFor(n) { return base + '?to=' + encodeURIComponent(n); }
  function copy(btn, text) {
    var ok = function () { btn.textContent = '已複製'; setTimeout(function () { btn.textContent = '複製連結'; }, 1600); };
    try { navigator.clipboard.writeText(text).then(ok, function () { btn.textContent = '請長按連結複製'; }); }
    catch (e) { btn.textContent = '請長按連結複製'; }
  }
  function render() {
    var names = box.value.split('\n').map(function (x) { return x.replace(/\s+/g, ' ').trim().slice(0, 20); }).filter(Boolean);
    list.textContent = '';
    if (!names.length) {
      var e = document.createElement('div'); e.className = 'empty'; e.textContent = '輸入名字後，下面會出現每個人的連結。'; list.appendChild(e); return;
    }
    names.forEach(function (n) {
      var url = linkFor(n);
      var row = document.createElement('div'); row.className = 'item';
      var b = document.createElement('b'); b.textContent = n;
      var c = document.createElement('button'); c.type = 'button'; c.className = 'btn main'; c.textContent = '複製連結';
      c.addEventListener('click', function () { copy(c, url); });
      var a = document.createElement('a'); a.className = 'btn'; a.href = url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = '預覽';
      var code = document.createElement('code'); code.textContent = base + '?to=' + n;
      row.append(b, c, a, code); list.appendChild(row);
    });
  }
  box.addEventListener('input', render);
  try { var saved = localStorage.getItem('invite10-names'); if (saved) { box.value = saved; render(); } } catch (e) {}
  box.addEventListener('input', function () { try { localStorage.setItem('invite10-names', box.value); } catch (e) {} });
})();
</script>
</body>
</html>
