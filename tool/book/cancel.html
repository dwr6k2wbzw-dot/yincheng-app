<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>我的訂位</title>
<meta name="theme-color" content="#0A0A09">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="brand">
    <img id="logo" alt="" hidden>
    <h1>我的訂位</h1>
  </header>
  <div class="card" id="box"><p>載入中…</p></div>
</main>
<script src="common.js"></script>
<script>
(async function () {
  const t = new URLSearchParams(location.search).get('t') || '';
  const box = document.getElementById('box');
  const status = { confirmed: '已確認', cancelled: '已取消', arrived: '已到店', no_show: '未到' };
  let want = null; // 想改成幾位
  function show(r, msg) {
    const lg = document.getElementById('logo');
    const lf = r.slug === 'yincheng' ? 'logo-yincheng.png' : r.slug === 'xcw' ? 'logo-xcw.png' : '';
    if (lf) { lg.src = lf; lg.hidden = false; }
    if (want == null) want = r.requested_party && r.party_request_status === 'pending' ? r.requested_party : r.party;
    const pending = r.party_request_status === 'pending';
    let h = '<p class="big">' + YC.esc(r.display_name) + '</p><p>' + YC.dateLabel(r.date) + ' ' + r.time + '　' + r.party + ' 位<br>' +
      YC.esc(r.name) + '<br>狀態：' + (status[r.status] || r.status) + '</p>' + (msg ? '<p class="ok">' + msg + '</p>' : '');
    if (pending) h += '<p class="ok">已申請改為 ' + r.requested_party + ' 位，等待店家確認（確認後會寄信通知您）。</p>';
    else if (r.party_request_status === 'approved' && r.requested_party === r.party) h += '<p class="note">店家已確認改為 ' + r.party + ' 位。</p>';
    else if (r.party_request_status === 'rejected') h += '<p class="note">上次申請改為 ' + r.requested_party + ' 位，店家無法調整，維持 ' + r.party + ' 位。</p>';
    // 更改人數（0055，老闆 2026-10-16：需店家確認）
    if (r.can_change) {
      h += '<div class="sep"></div><p class="label">更改人數</p>' +
        '<div class="stepper"><button type="button" id="pm" aria-label="減少">−</button><b id="pv">' + want + '</b><button type="button" id="pp" aria-label="增加">＋</button></div>' +
        '<p class="note">臨時增減人數需經店家確認；確認前仍以原本 ' + r.party + ' 位保留。</p>' +
        '<p class="err" id="perr" hidden></p><button class="primary ghost" id="pgo">' + (pending ? '修改申請' : '送出更改申請') + '</button>';
    }
    if (r.can_cancel) h += '<div class="sep"></div><p class="err" id="err" hidden></p><button class="primary danger" id="go">取消這筆訂位</button>';
    const rows = [];
    if (r.address) {
      const q = encodeURIComponent(r.address.replace(/[（(].*?[）)]/g, '').trim());
      rows.push('<div class="irow"><span class="ik">地址</span><span><a href="https://www.google.com/maps/search/?api=1&amp;query=' + q + '" target="_blank" rel="noopener">' + YC.esc(r.address) + '</a></span></div>');
    }
    if (r.phone) rows.push('<div class="irow"><span class="ik">電話</span><span><a href="tel:' + YC.esc(r.phone.replace(/[^0-9+]/g, '')) + '">' + YC.esc(r.phone) + '</a></span></div>');
    if (rows.length) h += '<div class="sep"></div>' + rows.join('');
    if (r.contact_note) h += '<p class="note" style="white-space:pre-wrap">' + YC.esc(r.contact_note) + '</p>';
    box.innerHTML = h;
    const pm = document.getElementById('pm'), pp = document.getElementById('pp'), pgo = document.getElementById('pgo');
    if (pm) {
      const upd = () => { document.getElementById('pv').textContent = want; pgo.disabled = want === r.party && !pending; };
      pm.onclick = () => { if (want > 1) { want--; upd(); } };
      pp.onclick = () => { if (want < 30) { want++; upd(); } };
      upd();
      pgo.onclick = async () => {
        pgo.disabled = true; pgo.textContent = '送出中…';
        try {
          const r2 = await YC.rpc('request_party_change', { p_token: t, p_party: want });
          want = null;
          show(r2, r2.party_request_status === 'pending' ? '' : '已撤回更改申請。');
          if (r2.party_request_status === 'pending') YC.mail(t, 'party');
        } catch (ex) {
          const e = document.getElementById('perr'); e.textContent = ex.message; e.hidden = false;
          pgo.disabled = false; pgo.textContent = '送出更改申請';
        }
      };
    }
    const go = document.getElementById('go');
    if (go) go.onclick = async () => {
      if (!confirm('確定要取消這筆訂位嗎？')) return;
      go.disabled = true; go.textContent = '取消中…';
      try {
        const r2 = await YC.rpc('cancel_reservation', { p_token: t });
        show(r2, '已取消，名額已釋出。');
        YC.mail(t, 'cancel');
      } catch (ex) {
        const e = document.getElementById('err'); e.textContent = ex.message; e.hidden = false;
        go.disabled = false; go.textContent = '取消這筆訂位';
      }
    };
  }
  try {
    if (!/^[0-9a-f-]{36}$/i.test(t)) throw new Error('連結不完整，請從確認信重新點開');
    const r = await YC.rpc('reservation_by_token', { p_token: t });
    if (!r) throw new Error('找不到這筆訂位，請從確認信重新點開');
    show(r);
  } catch (ex) { box.innerHTML = '<p class="err">' + YC.esc(ex.message) + '</p>'; }
})();
</script>
</body>
</html>
