# 每次推送到 main：在 GitHub 雲端編譯 Flutter 網頁版，發布到 GitHub Pages
name: 編譯並發布網頁版
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: 產生網頁平台設定（若尚未存在）
        run: |
          if [ ! -d web ]; then flutter create --platforms web --project-name yincheng_ops --org tw.yincheng . ; fi
          rm -f test/widget_test.dart
          python3 tool/patch_index.py
          sed -i 's/"name": ".*"/"name": "隱城營運"/; s/"short_name": ".*"/"short_name": "隱城營運"/; s/"background_color": ".*"/"background_color": "#0F1115"/; s/"theme_color": ".*"/"theme_color": "#0F1115"/' web/manifest.json
      - run: flutter pub get
      - name: 靜態檢查（只擋錯誤，不擋建議）
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1
          rc=$?
          cat analyze.txt
          if [ $rc -ne 0 ]; then
            msg=$(grep -E "error|warning" analyze.txt | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=analyze::${msg}"
          fi
          exit $rc
      - name: 編譯網頁版
        run: |
          set +e
          flutter build web --release --pwa-strategy=none --base-href "/${{ github.event.repository.name }}/" > build.txt 2>&1
          rc=$?
          cat build.txt
          if [ $rc -ne 0 ]; then
            msg=$(grep -iE "error" build.txt | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=build::${msg}"
          fi
          exit $rc
      - name: 另存一份編譯結果到 web-build 分支（供除錯檢查）
        run: |
          cd build/web
          git init -q -b web-build
          git -c user.email=ci@noreply -c user.name=ci add -A
          git -c user.email=ci@noreply -c user.name=ci commit -qm "build ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" web-build
          rm -rf .git
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
