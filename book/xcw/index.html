      const la = (P.address_i18n || {})[YCI.lang];  // 外語地址（例：英文）；中文用訂位設定的地址
      if (la) m = [null, la, (P.directions_i18n || {})[YCI.lang] || ''];
      rows.push('<div class="irow"><span class="ik">' + T('address') + '</span><span><a href="https://www.google.com/maps/search/?api=1&amp;query=' + q + '" target="_blank" rel="noopener">' +
        YC.esc(m ? m[1] : info.address) + '</a>' + (m && m[2] ? '<small>' + YC.esc(m[2]) + '</small>' : '') + '</span></div>');
    }
    if (info.phone) {
      rows.push('<div class="irow"><span class="ik">' + T('tel') + '</span><span><a href="tel:' + YC.esc(info.phone.replace(/[^0-9+]/g, '')) + '">' + YC.esc(info.phone) + '</a></span></div>');
    }
    // 低消：文字裡的 {amount} 換成「每人 800 元」（照語言、不斷行）；只填金額沒填文字就只寫金額
    const amt = P.min_spend ? '<span class="nw">' + YC.esc(T('minAmount', P.min_spend)) + '</span>' : '';
    const mt = pick(P.min_spend_text);
    if (mt || amt) rows.push('<div class="irow"><span class="ik">' + T('minSpend') + '</span><span>' + (mt ? txt(mt).replace(/\{amount\}/g, amt) : amt) + '</span></div>');
    // 店家自己加的列（例：小城外的咖啡、酒吧時段，隱城的營業時間）
    for (const r of P.info_rows || []) {
      const k = pick(r.label), v = pick(r.text);
      if (k && v) rows.push('<div class="irow"><span class="ik">' + YC.esc(k) + '</span><span>' + txt(v) + '</span></div>');
    }
    $('info').innerHTML = rows.join('');
    $('info').hidden = !rows.length;
  }
  // 月曆（0054，老闆 2026-10-16：改成月曆格）
  let calMonth = null; // 'YYYY-MM'
  const ym = (iso) => iso.slice(0, 7);
  function renderCal() {
    const byDate = Object.fromEntries(info.days.map(d => [d.date, d]));
    if (!info.days.length) { $('cal').innerHTML = ''; $('dsel').textContent = ''; return; }
    const firstM = ym(info.days[0].date), lastM = ym(info.days[info.days.length - 1].date);
    if (!calMonth || calMonth < firstM || calMonth > lastM) calMonth = day ? ym(day) : firstM;
    const [y, mo] = calMonth.split('-').map(Number);
    const startDow = new Date(y, mo - 1, 1).getDay();
    const nDays = new Date(y, mo, 0).getDate();
    const realToday = (() => { const n = new Date(Date.now() + 8 * 3600e3); return n.toISOString().slice(0, 10); })();
    let h = '<div class="calhead"><button type="button" class="nav" id="prevM" aria-label="' + T('prevMonth') + '"' + (calMonth <= firstM ? ' disabled' : '') + '>‹</button>' +
      '<b>' + T('monthTitle', y, mo) + '</b><button type="button" class="nav" id="nextM" aria-label="' + T('nextMonth') + '"' + (calMonth >= lastM ? ' disabled' : '') + '>›</button></div>';
    h += '<div class="calgrid">' + YC.week.map(w => '<span class="wk">' + w + '</span>').join('');
    for (let i = 0; i < startDow; i++) h += '<span></span>';
    for (let dd = 1; dd <= nDays; dd++) {
      const iso = calMonth + '-' + String(dd).padStart(2, '0');
      const d = byDate[iso];
      const isToday = iso === realToday ? ' today' : '';
      if (!d) { h += '<span class="cd off' + isToday + '">' + dd + '</span>'; continue; }
      const full = !d.closed && (d.groups_left === 0 || d.guests_left === 0);
      const offDay = d.closed;  // 已滿的日子仍可點，讓客人看到另一家店有沒有位子（老闆 2026-10-18）
      const tag = d.closed ? (YCI.lang === 'zh' && d.note ? d.note : T('closed')) : full ? T('full') : '';
      h += '<button type="button" class="cd' + isToday + (full ? ' full' : '') + (iso === day ? ' on' : '') + '" data-d="' + iso + '"' + (offDay ? ' disabled' : '') + '>' + dd +
        (tag ? '<small>' + YC.esc(tag.slice(0, 4)) + '</small>' : '') + '</button>';
    }
    $('cal').innerHTML = h + '</div>';
    if (day) {
      const dt = new Date(day + 'T00:00:00');
      $('dsel').textContent = T('dsel', dt) + (day === realToday ? T('today') : '');
    } else $('dsel').textContent = T('pickDate');
    const pv = $('prevM'), nx = $('nextM');
    if (pv) pv.onclick = () => { const t = new Date(y, mo - 2, 1); calMonth = t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0'); renderCal(); };
    if (nx) nx.onclick = () => { const t = new Date(y, mo, 1); calMonth = t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0'); renderCal(); };
  }
  // 名額以「整天」計算（0052）：每天幾組、幾位、大桌（4 位以上）幾組；公休／包場的日子不開放
  const large = () => info.large_party_size || 4;
  function partyOk(d, p) {
    if (!d || d.closed || d.groups_left === 0) return false;
    if (d.guests_left != null && p > d.guests_left) return false;
    if (d.large_left != null && p >= large() && d.large_left < 1) return false;
    return true;
  }
  function render() {
    $('party').textContent = party;
    renderCal();
    const cur = info.days.find(d => d.date === day);
    const ok = partyOk(cur, party);
    // 重新讀名額後，原本選的時段若已不在清單（例如過了當天截止時間）也要清掉（Codex 審查）
    if (!ok || !(cur && !cur.closed && cur.slots.some(s => s.time === time))) time = null;
    $('slots').innerHTML = (cur && !cur.closed ? cur.slots : []).map(s =>
      '<button type="button" class="chip' + (s.time === time ? ' on' : '') + '" data-t="' + s.time + '"' + (ok ? '' : ' disabled') + '>' + s.time + '</button>'
    ).join('') || '<p class="note">' + T('noSlots') + '</p>';
    let msg = '';
    if (cur && !cur.closed) {
      if (cur.groups_left === 0 || cur.guests_left === 0) msg = T('dayFull');
      else if (cur.guests_left != null && party > cur.guests_left) msg = T('dayLeft', cur.guests_left);
      else if (cur.large_left != null && party >= large() && cur.large_left < 1) msg = T('largeFull', large());
      else if (cur.guests_left != null && cur.guests_left <= 6) msg = T('fewLeft', cur.guests_left);
    }
    // 特殊日期有寫說明（沒公休、只改名額的日子）也顯示給客人看（Codex 審查）
    if (cur && !cur.closed && cur.note && YCI.lang === 'zh') msg = cur.note + (msg ? '\n' + msg : '');
    $('dayInfo').textContent = msg;
    renderAlt(cur, ok);
  }
  // 兩家互推（老闆 2026-10-18）：這家這天滿了（或人數放不下），另一家同一天還訂得到 → 顯示「改訂另一家」
  // 另一家＝訂位頁資料裡設定的姊妹店（0135，只能是同一個組織的店）
  const sis = () => (P.sister && P.sister.slug) || null;
  let other = null, otherLoading = null;
  async function loadOther() {
    if (!sis()) return null;
    if (!otherLoading) otherLoading = YC.rpc('reservation_availability', { p_slug: sis() }).then((r) => (other = r)).catch(() => null);
    return otherLoading;
  }
  function otherOk(d, p) {
    if (!other || !other.enabled || !d || d.closed || d.groups_left === 0) return false;
    if (p > (other.max_party || 0)) return false;
    if (d.guests_left != null && p > d.guests_left) return false;
    if (d.large_left != null && p >= (other.large_party_size || 4) && d.large_left < 1) return false;
    return d.slots && d.slots.length > 0;
  }
  async function renderAlt(cur, ok) {
    const box = $('alt');
    const show = () => {
      const od = other && other.enabled ? other.days.find((x) => x.date === day) : null;
      if (!sis() || !cur || cur.closed || ok || !otherOk(od, party)) { box.hidden = true; box.innerHTML = ''; return; }
      const S = P.sister, o = S.slug;
      // 有專屬網址的店（部署時產生 book/<店>/）連專屬網址，其他用 ?s=；來源記號沿用統計看得懂的 from-yc、from-xcw
      const from = slug === 'yincheng' ? 'from-yc' : ('from-' + slug).slice(0, 20);
      const href = ((window.YC_PRE || {})[o] ? o + '/?' : '?s=' + encodeURIComponent(o) + '&') +
        'd=' + day + '&p=' + party + '&lang=' + YCI.lang + '&ref=' + encodeURIComponent(from);
      const nm = pick(S.short_name) || pick(S.title) || S.display_name || '';
      box.innerHTML = '<p class="altk">' + T('altTitle') + '</p>' +
        '<p class="altn">' + YC.esc(nm) + (pick(S.intro) ? '<small>' + YC.esc(pick(S.intro)) + '</small>' : '') + '</p>' +
        '<a class="altb" href="' + YC.esc(href) + '">' + YC.esc(T('altGo', nm)) + ' →</a>';
      box.hidden = false;
    };
    if (!cur || cur.closed || ok) { box.hidden = true; return; }
    show();
    if (!other) { await loadOther(); show(); }
  }
  $('cal').onclick = (e) => { const b = e.target.closest('button[data-d]'); if (b && !b.disabled) { day = b.dataset.d; time = null; render(); } };
  $('slots').onclick = (e) => { const b = e.target.closest('button[data-t]'); if (b && !b.disabled) { time = b.dataset.t; render(); } };
  $('minus').onclick = () => { if (party > 1) { party--; render(); } };
  $('plus').onclick = () => { if (party < info.max_party) { party++; render(); } };
  // 稱謂：先生／小姐（老闆 2026-10-15），送出時接在姓名後面
  let title = null;
  document.querySelectorAll('#titles .chip').forEach((b) => {
    b.onclick = () => {
      title = b.dataset.t;
      document.querySelectorAll('#titles .chip').forEach((x) => { const on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-checked', on ? 'true' : 'false'); });
    };
  });
  const fullName = () => {
    const n = $('name').value.trim();
    if (!title || n.endsWith(title)) return n;
    return (n.replace(/\s*(先生|小姐)$/, '') + ' ' + title).slice(0, 40);
  };
  // 防重複送出（ops 0121）：每一次送出帶一個隨機代號，內容沒改的重送帶同一個。
  // 上一次其實訂成功、只是回應沒傳回來（斷線）→ 再按一次，伺服器認得是同一次，回同一筆，不會多訂。
  let reqId = null, reqSig = null;
  const newId = () => (crypto.randomUUID ? crypto.randomUUID()
    : '10000000-1000-4000-8000-100000000000'.replace(/[018]/g, (c) => (+c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (+c / 4)))).toString(16)));
  // 機器人驗證（ops 0146）：只有打開的店（資料庫回 captcha）才載入 Cloudflare Turnstile；隱城、小城外沒打開，什麼都不載入。
  // 送出前拿 Turnstile 的一次性 token 去換一張通行證（10 分鐘、只能用一次）；訂位失敗時通行證還在，可以直接再送。
  let cap = null, cfWidget = null, cfToken = null, pass = null, passAt = 0;
  const localErr = (m) => Object.assign(new Error(m), { local: true });  // 已經照語言寫好的訊息，不用再翻
  function setupCaptcha(c) {
    cap = c || null;
    const box = $('cf');
    if (!cap) { box.hidden = true; return; }
    box.hidden = false;
    if (!cap.site_key) { box.innerHTML = '<p class="err">' + YC.esc(T('captchaOff')) + '</p>'; $('submit').disabled = true; return; }
    if (cfWidget !== null) return;
    const render = () => {
      cfWidget = window.turnstile.render('#cf', {
        sitekey: cap.site_key, action: 'booking', theme: 'auto',
        language: YCI.lang === 'zh' ? 'zh-tw' : YCI.lang,
        callback: (t) => { cfToken = t; },
        'expired-callback': () => { cfToken = null; },
        'error-callback': () => { cfToken = null; },
      });
    };
    if (window.turnstile) { render(); return; }
    window.ycCfReady = render;
    const sc = document.createElement('script');
    sc.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=ycCfReady';
    sc.async = true; sc.defer = true;
    document.head.appendChild(sc);
  }
  function resetCaptcha() {
    pass = null; cfToken = null;
    if (cfWidget !== null && window.turnstile) window.turnstile.reset(cfWidget);
  }
  async function captchaPass() {
    if (pass && Date.now() - passAt < 9 * 60 * 1000) return pass;
    if (!cfToken) throw localErr(T('captchaNeed'));
    const t = cfToken; cfToken = null;
    try {
      pass = await YC.captcha(slug, t); passAt = Date.now();
    } finally {
      if (window.turnstile && cfWidget !== null) window.turnstile.reset(cfWidget);  // token 只能用一次
    }
    return pass;
  }
  $('form').onsubmit = async (e) => {
    e.preventDefault();
    const err = $('err'); err.hidden = true;
    if ($('website').value) return; // 機器人
    if (!day || !time) { err.textContent = T('needDateTime'); err.hidden = false; return; }
    if (!title && !/(先生|小姐)$/.test($('name').value.trim())) { err.textContent = T('needTitle'); err.hidden = false; return; }
    $('submit').disabled = true; $('submit').textContent = T('sending');
    try {
      const args = {
        p_slug: slug, p_date: day, p_time: time, p_party: party,
        p_name: fullName(), p_phone: $('phone').value.trim() || null, p_email: $('email').value, p_note: $('note').value || null, p_lang: YCI.lang,
        ...(ref ? { p_ref: ref } : {}),
      };
      const sig = JSON.stringify(args);
      if (sig !== reqSig) { reqSig = sig; reqId = newId(); }
      let r;
      try {
        r = await YC.rpc('book_reservation', cap ? { ...args, p_request: reqId, p_captcha: await captchaPass() } : { ...args, p_request: reqId });
      } catch (ex) {
        if (/CAPTCHA_REQUIRED/.test(ex.message)) { resetCaptcha(); throw localErr(T('captchaNeed')); }
        // 資料庫還沒更新到認得代號的版本（PGRST202＝找不到這個參數的函式）：照原本的方式送
        if (ex.code !== 'PGRST202' || cap) throw ex;
        r = await YC.rpc('book_reservation', args);
      }
      $('app').hidden = true;
      const done = $('done'); done.hidden = false;
      done.innerHTML = '<p class="big ok">' + T('booked') + '</p><p class="big">' + YC.esc(r.display_name) + '</p><p>' + YC.dateLabel(r.date) + ' ' + r.time + '　' + T('guests', r.party) + '<br>' + YC.esc(YCI.name(r.name)) + '</p><p class="hold">' + T('hold') + '</p><p class="note" id="mailNote">' + T('mailing') + '</p>' +
        '<p class="note">' + T('manageHint', 'cancel.html?t=' + r.token + '&lang=' + YCI.lang) + '</p>';
      // GA4（2026-11-24，見 ga.py）：訂位成功只送人數，姓名、電話、Email、日期時間等其他訂位內容都不送；部署時沒放 GA4 就沒有 gtag，什麼都不送
      if (window.gtag) gtag('event', 'booking_complete', { party_size: r.party });
      const sent = await YC.mail(r.token, 'confirm');
      $('mailNote').textContent = sent ? T('mailSent', $('email').value) : T('mailLate');
    } catch (ex) {
      err.textContent = ex.local ? ex.message : YCI.err(ex.message); err.hidden = false;
      $('submit').disabled = false; $('submit').textContent = T('submit');
      try { await load(); } catch (_) {}
    }
  };
  try { await load(); } catch (ex) { $('contact').textContent = YCI.err(ex.message); }
})();
</script>
